# Replaces the image's /etc/nginx/conf.d/default.conf, which is included inside the http block.

server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json
  application/manifest+json image/svg+xml;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A location with its own add_header doesn't inherit these, so they are repeated below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts content-hashed files here, so they can be cached forever.
    # A missing asset is a 404, never index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Always revalidate the entry page so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Unknown paths fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
