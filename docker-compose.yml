services:
  web:
    build: .
    image: clash-timers:local
    ports:
      - '8080:8080'
    restart: unless-stopped
    # Same check as the Dockerfile's HEALTHCHECK.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
